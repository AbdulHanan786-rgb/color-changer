<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color-changer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="min-h-screen flex justify-center items-center bg-gray-100">

        <div class="main-bg bg-blue-700 w-[750px] h-[550px] rounded-xl flex justify-center items-center">

            <div class="bg-blue-900 w-[350px] h-[450px] rounded-xl shadow-lg">

                <h1 class="font-bold text-white text-3xl ml-20 mt-10">
                    Color Changer
                </h1>

                <div class="bg-blue-500 w-72 h-20 rounded-lg ml-8 mt-3">

                </div>

                <div
                    class="bg-blue-900 w-40 h-10 border-2 border-white ml-24 mt-4 rounded-md flex items-center justify-between px-2">

                    <h1 class="text-white text-sm">#3B82F6</h1>

                    <button class="text-white hover:text-gray-300">
                        <i class="fa-regular fa-copy"></i>
                    </button>

                </div>

                <div class="flex flex-wrap gap-4 justify-center items-center mt-6  mx-auto">

                    <div class="bg-pink-400 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-orange-500 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-red-500 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-green-300 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-black w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-purple-500 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-yellow-400 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-blue-500 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-cyan-400 w-10 h-10 rounded-full border-2 border-white"></div>

                    <div class="bg-gray-500 w-10 h-10 rounded-full border-2 border-white"></div>

                </div>

                <button
                    class="bg-blue-500 w-64 h-12 rounded-md mt-6 ml-12 text-white font-bold hover:bg-blue-600">Random
                    Color
                    <i class="fa-solid fa-shuffle ml-8"></i>
                </button>

            </div>

        </div>

    </div>

</body>
<script src="script.js"></script>
</html>
